name: Verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.check.outputs.python }}
      typescript: ${{ steps.check.outputs.typescript }}
      go: ${{ steps.check.outputs.go }}
      rust: ${{ steps.check.outputs.rust }}
      java: ${{ steps.check.outputs.java }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          echo "python=$([ -f pyproject.toml ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "typescript=$([ -f package.json ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "go=$([ -f go.work ] || [ -f go.mod ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "rust=$([ -f Cargo.toml ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "java=$([ -f pom.xml ] && echo true || echo false)" >> $GITHUB_OUTPUT

  python:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-packages
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest

  typescript:
    needs: detect
    if: needs.detect.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test

  go:
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - uses: golangci/golangci-lint-action@v6
      - run: go test -race -cover ./...

  rust:
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy, rustfmt }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-features

  java:
    needs: detect
    if: needs.detect.outputs.java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B verify

  security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/default
            p/security-audit
            p/owasp-top-ten
            p/secrets
      - name: Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy.sarif }
      - name: AgentShield
        run: npx -y ecc-agentshield scan
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  compliance:
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Verify SoA exists and is recent
        run: |
          test -f docs/compliance/soa/iso27001-2022.md
          # Fail if not modified in last 365 days
          age_days=$(( ($(date +%s) - $(git log -1 --format=%ct docs/compliance/soa/iso27001-2022.md)) / 86400 ))
          if [ "$age_days" -gt 365 ]; then
            echo "ERROR: SoA not reviewed in $age_days days (>365)"
            exit 1
          fi

      - name: Verify policies exist
        run: |
          for policy in information-security-policy access-control-policy incident-response-policy vulnerability-management-policy; do
            test -f "docs/compliance/policies/${policy}.md" || { echo "Missing $policy"; exit 1; }
          done

      - name: Verify ADRs reference controls
        run: |
          missing=$(grep -rL "Controls" docs/decisions/ | wc -l | tr -d ' ')
          if [ "$missing" -gt 0 ]; then
            echo "WARNING: $missing ADRs missing Controls section"
            grep -rL "Controls" docs/decisions/
          fi

      - name: License scan
        uses: fossas/fossa-action@main
        continue-on-error: true
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}